<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome | Portal Authentication</title>
  <meta name="description" content="Authorized Staff & Fraud Operations Login Portal for AutomationEdge.">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #fff7ed;
      --card-bg: #ffffff;
      --text-main: #1c1917;
      --text-muted: #78716c;
      --text-light: #a8a29e;
      --border-line: #cbd5e1;
      --btn-primary: #f97316;
      --btn-primary-hover: #ea580c;
      --btn-outline: #ea580c;
      --font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      font-family: var(--font-family);
      background-color: #fff7ed;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 0.95) 0%, transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(254, 215, 170, 0.65) 0%, transparent 45%),
        radial-gradient(circle at 15% 85%, rgba(253, 186, 116, 0.5) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(249, 115, 22, 0.3) 0%, transparent 50%),
        linear-gradient(145deg, #ffffff 0%, #fff7ed 35%, #ffedd5 70%, #fed7aa 100%);
      background-attachment: fixed;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }

    /* Ambient Decorative Floating Orbs */
    .bg-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .bg-orb-1 {
      width: 320px;
      height: 320px;
      top: -5%;
      left: -5%;
      background: radial-gradient(circle, rgba(255, 237, 213, 0.85) 0%, transparent 70%);
    }

    .bg-orb-2 {
      width: 280px;
      height: 280px;
      bottom: 5%;
      left: 5%;
      background: radial-gradient(circle, rgba(254, 215, 170, 0.6) 0%, transparent 70%);
    }

    .bg-orb-3 {
      width: 360px;
      height: 360px;
      top: 25%;
      right: -5%;
      background: radial-gradient(circle, rgba(253, 186, 116, 0.45) 0%, transparent 70%);
    }

    .bg-orb-4 {
      width: 300px;
      height: 300px;
      bottom: -5%;
      right: 15%;
      background: radial-gradient(circle, rgba(249, 115, 22, 0.25) 0%, transparent 70%);
    }

    /* Floating Center Card */
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 36px 36px 28px;
      box-shadow: 0 20px 45px rgba(234, 88, 12, 0.12), 0 8px 24px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(254, 215, 170, 0.6);
      position: relative;
      z-index: 10;
      animation: cardFadeIn 0.3s ease-out;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Brand Logo Badge */
    .brand-logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 6px 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      margin-bottom: 24px;
    }

    .ae-logo-icon {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .ae-logo-symbol {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ae-logo-symbol svg {
      width: 100%;
      height: 100%;
    }

    .ae-logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
      text-align: left;
    }

    .ae-logo-text .t-top {
      font-size: 11px;
      font-weight: 800;
      color: #ea580c;
      letter-spacing: -0.2px;
    }

    .ae-logo-text .t-bot {
      font-size: 10px;
      font-weight: 700;
      color: #475569;
      letter-spacing: -0.2px;
    }

    /* Auth Header */
    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .auth-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.3px;
    }

    .brand-highlight {
      font-weight: 800;
      color: var(--text-main);
      display: block;
      margin-top: 2px;
    }

    .auth-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      font-weight: 400;
    }

    /* Alert Message */
    .login-alert {
      display: none;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 18px;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
    }

    .alert-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #059669;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }

    .form-control {
      width: 100%;
      border: none;
      border-bottom: 1.5px solid var(--border-line);
      border-radius: 0;
      padding: 10px 32px 10px 0;
      font-size: 14px;
      font-family: inherit;
      background: transparent;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-control:focus {
      border-bottom-color: #ea580c;
    }

    .form-control::placeholder {
      color: var(--text-light);
      font-size: 13.5px;
    }

    .btn-toggle-pwd {
      position: absolute;
      right: 0;
      bottom: 10px;
      background: none;
      border: none;
      color: var(--text-light);
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      transition: color 0.15s ease;
    }

    .btn-toggle-pwd:hover {
      color: var(--text-main);
    }

    /* Buttons */
    .btn-login {
      width: 100%;
      height: 44px;
      border-radius: 22px;
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      color: #ffffff;
      border: none;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.25);
    }

    .btn-login:hover:not(:disabled) {
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(234, 88, 12, 0.35);
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .btn-change-pwd {
      width: 100%;
      height: 44px;
      border-radius: 22px;
      background: #ffffff;
      color: #ea580c;
      border: 1.5px solid #fed7aa;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-family: inherit;
      margin-top: 12px;
    }

    .btn-change-pwd:hover {
      background: #fff7ed;
      border-color: #f97316;
    }

    /* Quick Demo Switcher Section */
    .quick-demo-section {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px dashed #e2e8f0;
    }

    .quick-demo-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .demo-chips-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .demo-chip {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      transition: all 0.15s ease;
      color: var(--text-main);
    }

    .demo-chip:hover {
      background: #fff7ed;
      border-color: #ea580c;
      color: #ea580c;
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(234, 88, 12, 0.15);
    }

    .chip-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f97316, #ea580c);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .chip-name {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11.5px;
    }

    .chip-role {
      font-size: 9.5px;
      color: var(--text-muted);
    }

    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 20px 22px;
        border-radius: 18px;
      }
      .demo-chips-grid {
        grid-template-columns: 1fr;
      }
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Ambient background lighting orbs -->
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="bg-orb bg-orb-4"></div>

  <!-- Center Auth Card -->
  <div class="auth-card">
    
    <!-- Header Text -->
    <div class="auth-header">
      <h2 class="auth-title">Welcome</h2>
      <p class="auth-subtitle">Please enter your credentials to continue</p>
    </div>

    <!-- Alert Notification Box -->
    <div class="login-alert" id="loginAlert">
      <i class="fa-solid fa-circle-exclamation" id="alertIcon"></i>
      <span id="alertMessage">Invalid credentials</span>
    </div>

    <!-- Login Form -->
    <form id="staffLoginForm" autocomplete="on">
      <div class="form-group">
        <input 
          type="text" 
          id="usernameInput" 
          class="form-control" 
          placeholder="Username" 
          required 
          autofocus
        >
      </div>

      <div class="form-group">
        <input 
          type="password" 
          id="passwordInput" 
          class="form-control" 
          placeholder="Password" 
          required
        >
        <button type="button" class="btn-toggle-pwd" id="btnTogglePassword" title="Toggle password visibility" aria-label="Toggle password visibility">
          <i class="fa-regular fa-eye" id="pwdEyeIcon"></i>
        </button>
      </div>

      <button type="submit" class="btn-login" id="btnSubmitLogin">
        <span id="btnText">Login</span>
        <i class="fa-solid fa-arrow-right" id="btnIcon" style="font-size: 12px;"></i>
      </button>

      <button type="button" class="btn-change-pwd" id="btnChangePwd" onclick="alert('Password reset link has been dispatched to your registered administrator email.')">
        Change Password
      </button>
    </form>

    <!-- Quick Demo Switcher Section -->
    <div class="quick-demo-section">
      <div class="quick-demo-title">
        <span><i class="fa-solid fa-users"></i> Demo Staff Accounts:</span>
        <span style="font-weight: 600; text-transform: none; color: #ea580c;">Click to login</span>
      </div>

      <div class="demo-chips-grid">
        <button type="button" class="demo-chip" data-user="investigator3" data-pass="Password@123" title="Login as Abhishek Malwadkar (High-Value Fraud Forensics)">
          <div class="chip-avatar" style="background: linear-gradient(135deg, #f97316, #ea580c);">AM</div>
          <div>
            <div class="chip-name">Abhishek M.</div>
            <div class="chip-role">High-Value Fraud</div>
          </div>
        </button>

        <button type="button" class="demo-chip" data-user="manager" data-pass="Password@123" title="Login as Vikram Malhotra (Branch Manager)">
          <div class="chip-avatar" style="background: linear-gradient(135deg, #059669, #047857);">VM</div>
          <div>
            <div class="chip-name">Vikram Malhotra</div>
            <div class="chip-role">Branch Manager</div>
          </div>
        </button>

        <button type="button" class="demo-chip" data-user="investigator2" data-pass="Password@123" title="Login as Pooja Bansal (Customer Helpdesk & Disputes)">
          <div class="chip-avatar" style="background: linear-gradient(135deg, #d97706, #b45309);">PB</div>
          <div>
            <div class="chip-name">Pooja Bansal</div>
            <div class="chip-role">Customer Disputes</div>
          </div>
        </button>

        <button type="button" class="demo-chip" data-user="investigator1" data-pass="Password@123" title="Login as SOC Operations Team (Cyber Defense)">
          <div class="chip-avatar" style="background: linear-gradient(135deg, #ea580c, #c2410c);">SOC</div>
          <div>
            <div class="chip-name">SOC Operations</div>
            <div class="chip-role">Cyber Defense</div>
          </div>
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("staffLoginForm");
      const usernameInput = document.getElementById("usernameInput");
      const passwordInput = document.getElementById("passwordInput");
      const btnSubmit = document.getElementById("btnSubmitLogin");
      const btnText = document.getElementById("btnText");
      const btnIcon = document.getElementById("btnIcon");
      const alertBox = document.getElementById("loginAlert");
      const alertMsg = document.getElementById("alertMessage");
      const alertIcon = document.getElementById("alertIcon");
      const btnTogglePwd = document.getElementById("btnTogglePassword");
      const pwdEyeIcon = document.getElementById("pwdEyeIcon");

      // Check existing session
      const existingSession = localStorage.getItem("fraud_staff_session");
      if (existingSession) {
        try {
          const parsed = JSON.parse(existingSession);
          if (parsed && parsed.username) {
            usernameInput.value = parsed.username;
          }
        } catch (e) {}
      }

      // Show/Hide Password
      btnTogglePwd.addEventListener("click", () => {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
        pwdEyeIcon.className = isPassword ? "fa-regular fa-eye-slash" : "fa-regular fa-eye";
      });

      // Quick Demo Click
      document.querySelectorAll(".demo-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          const u = btn.getAttribute("data-user");
          const p = btn.getAttribute("data-pass");
          usernameInput.value = u;
          passwordInput.value = p;
          performLogin(u, p);
        });
      });

      // Form Submit
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        performLogin(usernameInput.value.trim(), passwordInput.value.trim());
      });

      async function performLogin(username, password) {
        if (!username || !password) {
          showAlert("Please enter your employee username and password.", "error");
          return;
        }

        hideAlert();
        setLoading(true);

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();

          if (!res.ok || !data.success) {
            throw new Error(data.detail || data.message || "Invalid employee credentials.");
          }

          showAlert(`Authentication verified. Welcome, ${data.user.full_name}!`, "success");
          
          // Save session
          localStorage.setItem("fraud_staff_session", JSON.stringify(data.user));
          if (data.token) {
            localStorage.setItem("fraud_staff_token", data.token);
          }
          localStorage.removeItem("fraud_customer_session");
          localStorage.removeItem("fraud_customer_token");
          localStorage.removeItem("fraud_user_type");

          setTimeout(() => {
            window.location.href = "/";
          }, 400);

        } catch (err) {
          showAlert(err.message, "error");
          setLoading(false);
        }
      }

      function showAlert(msg, type = "error") {
        alertMsg.textContent = msg;
        alertBox.className = `login-alert alert-${type}`;
        alertIcon.className = type === "success" ? "fa-solid fa-circle-check" : "fa-solid fa-triangle-exclamation";
        alertBox.style.display = "flex";
      }

      function hideAlert() {
        alertBox.style.display = "none";
      }

      function setLoading(isLoading) {
        btnSubmit.disabled = isLoading;
        if (isLoading) {
          btnText.textContent = "Verifying...";
          btnIcon.className = "spinner";
        } else {
          btnText.textContent = "Login";
          btnIcon.className = "fa-solid fa-arrow-right";
        }
      }
    });
  </script>
</body>
</html>
